minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Transitive security floors. fumanchu still declares handlebars ^4.7.9.
# undici 7 and 8 are separate lines (@cacheable/net, AI SDK, miniflare, docula).
overrides:
  handlebars: ">=4.7.10"
  "undici@7": ">=7.29.1 <8"
  "undici@8": ">=8.10.2 <9"
