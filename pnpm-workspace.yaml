minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Exact version only. @jaredwray/fumanchu@4.7.5 was published 2026-10-26 and is
# inside the 7-day cooldown. It is the release that depends on markdown-it
# ^15.0.3 (CVE-2026-111758). Needs Jared's sign-off.
minimumReleaseAgeExclude:
  - "@jaredwray/fumanchu@4.7.5"
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Transitive security floors.
# undici@7 requests are pinned to 8.12.2
# (@cacheable/net, AI SDK, miniflare, docula).
# miniflare requests undici 7.29.1, so that floor stays.
overrides:
  "undici@7": "8.12.2"
